name: Build Project

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build
      run: chmod +x ./ipabuild.sh && ./ipabuild.sh

    - name: Upload IPA as an artifact
      uses: actions/upload-artifact@v4
      with:
        name: Pocket Poster
        path: build/Pocket Poster.ipa